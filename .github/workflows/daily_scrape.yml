name: Daily Scraper Schedule

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC
  workflow_dispatch:      # Allows manual trigger via GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute Scraper
        env:
          # ── Shared login password for all RM accounts ──────────────────────
          RM_PASSWORD: ${{ secrets.RM_PASSWORD }}

          # ── Bot: rm_daily_txns_ranjitha_bot ───────────────────────────────
          TELEGRAM_BOT_TOKEN_RANJITHA: ${{ secrets.TELEGRAM_BOT_TOKEN_RANJITHA }}
          TELEGRAM_CHAT_ID_RANJITHA: ${{ secrets.TELEGRAM_CHAT_ID_RANJITHA }}

          # ── Bot: rm_daily_txns_poornima_bot ───────────────────────────────
          TELEGRAM_BOT_TOKEN_POORNIMA: ${{ secrets.TELEGRAM_BOT_TOKEN_POORNIMA }}
          TELEGRAM_CHAT_ID_POORNIMA: ${{ secrets.TELEGRAM_CHAT_ID_POORNIMA }}

          # ── Bot: rm_daily_txns_pavana_bot ─────────────────────────────────
          TELEGRAM_BOT_TOKEN_PAVANA: ${{ secrets.TELEGRAM_BOT_TOKEN_PAVANA }}
          TELEGRAM_CHAT_ID_PAVANA: ${{ secrets.TELEGRAM_CHAT_ID_PAVANA }}

          # ── Bot: rm_daily_txns_manav_bot ──────────────────────────────────
          TELEGRAM_BOT_TOKEN_MANAV: ${{ secrets.TELEGRAM_BOT_TOKEN_MANAV }}
          TELEGRAM_CHAT_ID_MANAV: ${{ secrets.TELEGRAM_CHAT_ID_MANAV }}

          # ── Bot: rm_daily_txns_others_bot ─────────────────────────────────
          TELEGRAM_BOT_TOKEN_OTHERS: ${{ secrets.TELEGRAM_BOT_TOKEN_OTHERS }}
          TELEGRAM_CHAT_ID_OTHERS: ${{ secrets.TELEGRAM_CHAT_ID_OTHERS }}

        run: python main.py
