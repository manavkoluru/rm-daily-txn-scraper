name: Rich Maker Daily Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check configured environment names
        env:
          RM_USER_1: ${{ secrets.RM_USER_1 }}
          RM_PASS_1: ${{ secrets.RM_PASS_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$RM_USER_1" && echo "RM_USER_1 is configured" || echo "RM_USER_1 is missing"
          test -n "$RM_PASS_1" && echo "RM_PASS_1 is configured" || echo "RM_PASS_1 is missing"
          test -n "$TELEGRAM_BOT_TOKEN" && echo "TELEGRAM_BOT_TOKEN is configured" || echo "TELEGRAM_BOT_TOKEN is missing"
          test -n "$TELEGRAM_CHAT_ID" && echo "TELEGRAM_CHAT_ID is configured" || echo "TELEGRAM_CHAT_ID is missing"

      - name: Run scraper
        env:
          RM_USER_1: ${{ secrets.RM_USER_1 }}
          RM_PASS_1: ${{ secrets.RM_PASS_1 }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}

        run: python main.py
